'The tower was my mother’s idea. “Build something tall,” she said, “so people can find you.” I built something tall so they couldn’t.',

'Mother’s recipe book is down here. Last page: “Vex’s birthday cake. He likes it with extra moat.” I don’t know what that means. I am crying. Allergies.',

'The snow doesn’t stop them. Hailwyn says the heroes aren’t trying to conquer the tower. Then why do they keep COMING?',

'Every banner in the Keep has been rehung. Not torn down. Rehung. Straighter. Somebody who loves this tower did that.',
'Ladderton’s new armor is gold. Gold like a candle. Gold like a lot of candles. Gold like seventeen candles, one per floor.',

 c.restore();if(LV&&LV.mode==='night'&&(phase==='build'||phase==='run'||phase==='result'))nightfall();vignette();c.textAlign='left';drawGameUI()}
